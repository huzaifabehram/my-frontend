<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- White, to match the site header — with the old black value the phone's
         address bar / status area was a black band above the page while it loaded. -->
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Learn digital marketing and e-commerce with practical, project-based courses taught in Urdu."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- FONTS: DM Sans + Playfair Display used to be requested only from inside
         the course page's own CSS, i.e. after the whole JavaScript bundle had
         downloaded and that page had rendered — so text first appeared in a
         fallback font and then jumped. Requested here they download in
         parallel with the app from the very first byte. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://img.youtube.com" crossorigin />

    <title>Lerni</title>

    <!-- FIRST-PAINT SHELL. Before this, the page was pure white until the whole
         JavaScript bundle had downloaded and run. Now the browser paints a page
         background + a header bar (with the real logo, read from the copy the
         site cached on the last visit) + a thin progress line straight away.
         React replaces everything inside #root the moment the app starts, so
         this is only ever on screen for the gap before that. The header
         measurements mirror components/SiteHeader.jsx so nothing jumps. -->
    <style>
      html, body { margin: 0; background: #FDFAF6; }
      #app-shell { min-height: 100vh; background: #FDFAF6; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #app-shell .shell-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 10; }
      #app-shell .shell-bar i { display: block; height: 100%; width: 0; background: #e8540a; box-shadow: 0 0 8px rgba(232,84,10,.6); animation: shell-progress 6s cubic-bezier(.1,.6,.3,1) forwards; }
      @keyframes shell-progress { 0% { width: 0; } 20% { width: 45%; } 60% { width: 75%; } 100% { width: 92%; } }
      #app-shell header { background: #fff; border-bottom: 1px solid #ece6dd; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
      #app-shell .shell-in { max-width: 80rem; margin: 0 auto; padding: 12px 16px; min-height: 56px; display: flex; align-items: center; justify-content: center; box-sizing: content-box; }
      #app-shell .shell-in img { display: none; height: 56px; width: auto; object-fit: contain; }
      #app-shell .shell-in .shell-word { display: none; font: 800 28px/1 'Playfair Display', Georgia, serif; color: #1a1208; }
      #app-shell .shell-in .shell-word b { color: #e8540a; }
      @media (min-width: 768px) { #app-shell .shell-in { padding: 16px 16px; min-height: 64px; } #app-shell .shell-in img { height: 64px; } }
      @media (min-width: 1024px) { #app-shell .shell-in { padding: 16px 24px; min-height: 80px; justify-content: flex-start; } #app-shell .shell-in img { height: 80px; } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div id="app-shell" aria-hidden="true">
        <div class="shell-bar"><i></i></div>
        <header>
          <div class="shell-in">
            <img id="shell-logo" alt="" />
            <span id="shell-word" class="shell-word">Ler<b>ni</b></span>
          </div>
        </header>
      </div>
    </div>
    <script>
      // Show the cached logo if we have one; otherwise the text wordmark.
      (function () {
        try {
          var logo = localStorage.getItem('lerni_header_logo_url');
          var img = document.getElementById('shell-logo');
          var word = document.getElementById('shell-word');
          if (logo) { img.src = logo; img.style.display = 'block'; }
          else if (logo === null) { /* first ever visit — leave the header bar empty rather than guess */ }
          else { word.style.display = 'block'; }
        } catch (e) {}
      })();
    </script>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
